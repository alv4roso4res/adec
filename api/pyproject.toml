[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alv4roso4res", email = "alvaropaivasoares@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cachetools>=7.2.6",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
]
