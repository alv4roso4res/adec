name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  IMAGENS: ghcr.io/alv4roso4res   # dono das imagens no GHCR (minúsculo)

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: API - instalar e testar (pytest)
        working-directory: api
        run: |
          uv sync --locked
          uv run pytest -v

      - name: Instalar o Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - instalar, lint e build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    needs: build-test
    if: github.event_name == 'push'   # só no merge na main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Calcular o SHA curto
        run: echo "SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Entrar no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a imagem da API
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: true
          build-args: APP_VERSION=${{ env.SHA }}
          tags: ${{ env.IMAGENS }}/adec-api:sha-${{ env.SHA }}

      - name: Publicar a imagem do frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          build-args: APP_VERSION=${{ env.SHA }}
          tags: ${{ env.IMAGENS }}/adec-frontend:sha-${{ env.SHA }}