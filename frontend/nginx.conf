server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interno do Docker. Com o upstream numa variável o nginx resolve "api"
    # a cada requisição (valid=10s) em vez de só na subida: se o container da
    # API for recriado (novo IP, ex.: watch-deploy.sh) ou ainda não existir, o
    # nginx continua de pé e volta a funcionar sozinho.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api/... vai para a API SEM remover o prefixo (ela já responde em /api).
    # Sem URI no proxy_pass com variável, o nginx repassa a URI original.
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Nunca em cache: é por eles que o navegador descobre a versão nova.
    # O fallback da SPA também cai em /index.html, então herda isto.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # SPA
    location / {
        try_files $uri /index.html;
    }
}
